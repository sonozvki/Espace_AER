# Environnement de production
# Usage : docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Prérequis :
#   - Fichier .env.prod à la racine avec toutes les variables
#   - Traefik démarré dans /home/ubuntu/Projets/traefik (crée le réseau traefik-net)

services:
  db:
    image: postgres:16-alpine
    container_name: aer-db-prod
    environment:
      POSTGRES_DB: aer_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aer_prod"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  backend:
    build:
      context: ./back
      target: prod
    container_name: aer-backend-prod
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/aer_prod
      PORT: 8081
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - traefik-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.aer-backend.rule=Host(`espace-aer.nice-tek.eu`) && (PathPrefix(`/auth`) || PathPrefix(`/api`))"
      - "traefik.http.routers.aer-backend.entrypoints=websecure"
      - "traefik.http.routers.aer-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aer-backend.priority=10"
      - "traefik.http.services.aer-backend-svc.loadbalancer.server.port=8081"
      - "traefik.http.routers.aer-backend.service=aer-backend-svc"

  frontend:
    build:
      context: ./front
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: aer-frontend-prod
    networks:
      - traefik-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.aer-frontend.rule=Host(`espace-aer.nice-tek.eu`)"
      - "traefik.http.routers.aer-frontend.entrypoints=websecure"
      - "traefik.http.routers.aer-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aer-frontend.priority=1"
      - "traefik.http.services.aer-frontend-svc.loadbalancer.server.port=80"
      - "traefik.http.routers.aer-frontend.service=aer-frontend-svc"

networks:
  internal:
    name: aer-prod-internal
  traefik-net:
    external: true
    name: traefik-net

volumes:
  db-prod:
    name: aer-db-prod
