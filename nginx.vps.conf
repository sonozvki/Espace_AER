# Config nginx à placer sur le VPS (ex: /etc/nginx/sites-available/espace-aer)
# Remplacer espace-aer.example.com par ton vrai domaine
# SSL géré par Certbot : sudo certbot --nginx -d espace-aer.example.com -d api.espace-aer.example.com

# Frontend
server {
    listen 80;
    server_name espace-aer-nice.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Backend API
server {
    listen 80;
    server_name api.espace-aer-nice.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
